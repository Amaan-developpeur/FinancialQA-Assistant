<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Financial QA Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="container">
    <h1>💬 Financial QA Assistant</h1>

    <div id="input-area">
      <textarea id="question" placeholder="Ask a financial question..."></textarea>
      <button id="ask-btn">Ask</button>
    </div>

    <div id="response-area">
      <div id="answer"></div>
      <div id="sources"></div>
      <div id="latency"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
